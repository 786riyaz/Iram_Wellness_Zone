# Deploy a plain static site (no Jekyll, no build step) to GitHub Pages.
# This is GitHub's official "static.yml" template for non-Jekyll sites.
#
# To use it: in your repository, go to Settings -> Pages -> Build and
# deployment -> Source, and select "GitHub Actions". This workflow will
# then run automatically on every push to the default branch.
#
# If you'd rather not use GitHub Actions at all, you can instead set
# Source to "Deploy from a branch" and pick your default branch + "/ (root)"
# folder -- in that case this workflow file is not needed and can be deleted.

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
